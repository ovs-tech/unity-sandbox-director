<body
  class="bg-background-light dark:bg-background-dark font-display antialiased selection:bg-primary selection:text-white">
  <div class="relative flex min-h-screen w-full flex-col overflow-hidden">
    <div
      class="absolute inset-0 z-0 h-full w-full bg-cover bg-center bg-no-repeat transition-transform duration-[10s] hover:scale-105"
      data-alt="Abstract dark photography studio lighting setup with purple and red hues"
      style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAKeUvnc-QanZ-lzSyUnGfPMJ4CSQd32Zg-S_azy6epSF1j6FYu9_XOfpv5kb60aBU2Pgy5qcOQz9apEzDlelh9HPBj_kA7OPz2VhP80OqYJAfTxcBWpEHaHp3YwlT8VbOIRSYpHatFxQxOJpY9Dg2n9U-db5aKSkHTlAZ-Gf727_4v5jqwhse4g8okbQdppfUPWXVMYmjcb0ri4SV3FprtDZQTg4CdqzVgkCLhdd9Hz_AxLQwkHNWEVaEPA_RSwyNHciWlZfNe9gA');">
    </div>
    <div class="absolute inset-0 z-10 bg-gradient-to-b from-[#221016]/70 via-[#221016]/80 to-[#221016]"></div>
    <div class="relative z-20 flex h-full flex-grow flex-col justify-center px-6 py-8 sm:px-8">
      <div class="mb-8 flex flex-col items-center justify-center">
        <div
          class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-br from-primary to-rose-900 shadow-[0_0_20px_rgba(236,19,91,0.5)]">
          <span class="material-symbols-outlined text-2xl text-white">movie_filter</span>
        </div>
        <h1
          class="text-center text-3xl font-extrabold uppercase leading-none tracking-tight text-white drop-shadow-xl sm:text-4xl">
          Create <span class="text-primary">Account</span>
        </h1>
        <p class="mt-2 text-center text-sm font-medium text-gray-400">
          Join the studio and start directing.
        </p>
      </div>
      <div class="w-full max-w-md mx-auto">
        <form action="#" class="flex flex-col gap-4">
          <div class="space-y-1">
            <label class="text-xs font-bold uppercase tracking-wider text-gray-400 pl-1" for="email">Email</label>
            <div class="relative">
              <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                <span class="material-symbols-outlined text-[20px] text-gray-500">mail</span>
              </div>
              <input
                class="form-glass block w-full rounded-xl py-3.5 pl-12 pr-4 text-white placeholder-gray-600 focus:border-primary focus:ring-1 focus:ring-primary sm:text-sm transition-all outline-none"
                id="email" placeholder="director@example.com" type="email" />
            </div>
          </div>
          <div class="space-y-1">
            <label class="text-xs font-bold uppercase tracking-wider text-gray-400 pl-1" for="password">Password</label>
            <div class="relative">
              <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                <span class="material-symbols-outlined text-[20px] text-gray-500">lock</span>
              </div>
              <input
                class="form-glass block w-full rounded-xl py-3.5 pl-12 pr-4 text-white placeholder-gray-600 focus:border-primary focus:ring-1 focus:ring-primary sm:text-sm transition-all outline-none"
                id="password" placeholder="••••••••" type="password" />
            </div>
          </div>
          <div class="space-y-1">
            <label class="text-xs font-bold uppercase tracking-wider text-gray-400 pl-1" for="password_confirm">Confirm
              Password</label>
            <div class="relative">
              <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                <span class="material-symbols-outlined text-[20px] text-gray-500">lock_reset</span>
              </div>
              <input
                class="form-glass block w-full rounded-xl py-3.5 pl-12 pr-4 text-white placeholder-gray-600 focus:border-primary focus:ring-1 focus:ring-primary sm:text-sm transition-all outline-none"
                id="password_confirm" placeholder="••••••••" type="password" />
            </div>
          </div>
          <div class="mt-2 space-y-3 px-1">
            <label class="group flex cursor-pointer items-start gap-3 checkbox-wrapper">
              <input class="peer sr-only" id="age-check" type="checkbox" />
              <div
                class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded border border-gray-600 bg-white/5 transition-all duration-200 peer-focus:ring-2 peer-focus:ring-primary/50 group-hover:border-gray-500">
                <svg class="hidden h-3.5 w-3.5 text-white pointer-events-none" fill="none" stroke="currentColor"
                  viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
                </svg>
              </div>
              <span class="select-none text-xs font-medium text-gray-400 transition-colors group-hover:text-gray-300">
                I am 18 years of age or older.
              </span>
            </label>
            <label class="group flex cursor-pointer items-start gap-3 checkbox-wrapper">
              <input class="peer sr-only" id="tos-check" type="checkbox" />
              <div
                class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded border border-gray-600 bg-white/5 transition-all duration-200 peer-focus:ring-2 peer-focus:ring-primary/50 group-hover:border-gray-500">
                <svg class="hidden h-3.5 w-3.5 text-white pointer-events-none" fill="none" stroke="currentColor"
                  viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
                </svg>
              </div>
              <span class="select-none text-xs font-medium text-gray-400 transition-colors group-hover:text-gray-300">
                I agree to the <a class="text-primary hover:text-white hover:underline" href="#">Terms of Service</a>
                and <a class="text-primary hover:text-white hover:underline" href="#">Privacy Policy</a>.
              </span>
            </label>
          </div>
          <button
            class="mt-6 relative flex w-full items-center justify-center overflow-hidden rounded-xl bg-primary px-6 py-4 text-center font-display text-lg font-bold uppercase tracking-wide text-white shadow-[0_4px_20px_rgba(236,19,91,0.4)] transition-all duration-300 hover:bg-rose-600 hover:shadow-[0_6px_25px_rgba(236,19,91,0.6)] hover:-translate-y-0.5 active:translate-y-0.5 active:shadow-none"
            type="button">
            <span class="mr-2">Register</span>
            <span class="material-symbols-outlined text-[22px]">app_registration</span>
            <div
              class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent transition-transform hover:animate-[shimmer_1s_infinite]">
            </div>
          </button>
        </form>
        <div class="mt-8 text-center">
          <a class="text-sm font-semibold text-white/60 transition-colors hover:text-white hover:underline decoration-primary decoration-2 underline-offset-4"
            href="#">
            Already a Director? <span class="text-primary">Login</span>
          </a>
          <div class="mt-6 flex items-center justify-center gap-2 opacity-30">
            <span class="material-symbols-outlined text-xs text-white">lock</span>
            <span class="text-[10px] text-white uppercase tracking-widest">Secure Registration</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <style>
    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }
  </style>
